[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  CI = "false"
  NODE_VERSION = "20"
  # VITE_API_BASE_URL is deliberately NOT set here. It used to be pinned to
  # http://localhost:3777 "until the API is deployed", which meant every
  # production deploy shipped a site calling the visitor's own machine — and
  # because it was set, the missing-value case never surfaced. Set it per-site
  # in Site settings → Environment variables. src/lib/api.ts now throws on a
  # production build without it, so a misconfigured deploy fails loudly instead
  # of looking like a backend outage.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
